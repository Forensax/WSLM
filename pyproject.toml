[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wslm"
version = "0.0.2"
description = "简洁的 Windows WSL 环境管理器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.10,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
]
build = [
    "pyinstaller>=6.15,<7",
]

[project.scripts]
wslm = "wslm.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wslm = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
